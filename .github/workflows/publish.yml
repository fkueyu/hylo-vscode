name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Publish to VS Code Marketplace"
        required: true
        type: boolean
        default: true
      publish_openvsx:
        description: "Publish to Open VSX"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx vsce package -o extension.vsix

      - name: Verify VSIX contents
        run: |
          unzip -Z1 extension.vsix > vsix-files.txt
          grep -qx "extension/dist/parser-worker.js" vsix-files.txt
          grep -qx "extension/media/preview-frame.js" vsix-files.txt
          grep -qx "extension/media/document-structure.js" vsix-files.txt
          if grep -Eq "(^|/)(test|src|vendor)/|\.map$" vsix-files.txt; then
            echo "Unexpected development files found in extension.vsix"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        if: ${{ github.event_name == 'push' || inputs.publish_marketplace }}
        run: npx vsce publish --packagePath extension.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ github.event_name == 'push' || inputs.publish_openvsx }}
        run: npx ovsx@0.10.12 publish extension.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
